<!DOCTYPE html>
<html>
<head><title>Generate PWA Icons</title></head>
<body>
<p>Generating icons... Check downloads.</p>
<script>
// Reuses IconGenerator logic to produce downloadable PNGs
function generateIcon(size) {
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#1a1210';
  ctx.fillRect(0, 0, size, size);
  const cx = size / 2, cy = size / 2, r = size * 0.38;
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const angle = (Math.PI / 3) * i - Math.PI / 6;
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = '#2a1f14';
  ctx.fill();
  ctx.strokeStyle = '#c9a84c';
  ctx.lineWidth = size * 0.04;
  ctx.stroke();
  ctx.strokeStyle = 'rgba(201,168,76,0.3)';
  ctx.lineWidth = size * 0.02;
  ctx.beginPath();
  ctx.moveTo(cx, cy - r * 0.7);
  ctx.lineTo(cx - r * 0.6, cy + r * 0.5);
  ctx.lineTo(cx + r * 0.6, cy + r * 0.5);
  ctx.closePath();
  ctx.stroke();
  ctx.fillStyle = '#c9a84c';
  ctx.font = `bold ${size * 0.3}px 'Courier New', monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('20', cx, cy + size * 0.02);
  return c;
}

[192, 512].forEach(size => {
  const canvas = generateIcon(size);
  const link = document.createElement('a');
  link.download = `icon-${size}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
});
document.body.innerHTML += '<p>Done! Place icon-192.png and icon-512.png in project root.</p>';
</script>
</body>
</html>
