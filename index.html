<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1a1210" />
  <meta name="description" content="Dungeon Survivors: D20 — Bullet Heaven в D&D-сеттинге" />
  <title>Dungeon Survivors — D20</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" id="favicon" type="image/png" href="" />
  <link rel="apple-touch-icon" id="touchIcon" href="" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <!-- Title Screen -->
  <div id="titleScreen">
    <div class="title-bg-pattern"></div>
    <div class="title-runes" id="titleRunes"></div>
    <div class="title-logo">
      <div class="title-main">Dungeon Survivors</div>
      <div class="title-sub">D20</div>
    </div>
    <div class="title-tap">Нажмите, чтобы начать</div>
  </div>

  <!-- Loading Screen -->
  <div id="loadingScreen">
    <div class="loading-die" id="loadingDie">20</div>
    <div class="loading-text">Загрузка...</div>
  </div>

  <!-- Canvas -->
  <canvas id="game"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-top-left">
      <div id="hpBar" class="bar"><div class="fill"></div><div class="label">HP: 100/100</div></div>
      <div id="xpBar" class="bar"><div class="fill"></div><div class="label xp-level-label"></div></div>
      <div class="mini-cd-row">
        <div id="cdMissile" class="mini-cd"><div class="cd-fill"></div><div class="cd-icon">✦</div></div>
      </div>
    </div>
    <div class="hud-top-right">
      <button id="pauseBtn" title="Пауза">⏸</button>
      <div id="killCount">Убийств: 0</div>
      <div id="runTimer">00:00</div>
      <div id="waveInfo">Волна 1 через 20с</div>
    </div>
  </div>

  <!-- Слоты: оружие слева, пассивки справа -->
  <div id="weaponSlots"  class="slot-col left"></div>
  <div id="abilitySlots" class="slot-col right"></div>

  <!-- Динамический джойстик -->
  <div id="joystick"><div class="stick"></div></div>

  <!-- Меню (legacy, hidden by default) -->
  <div id="menuOverlay" class="overlay">
    <h1>DUNGEON SURVIVORS</h1>
    <h2>D20</h2>
    <p>Касание — динамический джойстик. ПК: WASD/стрелки.</p>
    <button id="startBtn" class="btn">НАЧАТЬ</button>
  </div>

  <!-- Пауза -->
  <div id="pauseOverlay" class="overlay">
    <h1>ПАУЗА</h1>
    <button id="resumeBtn" class="btn">Продолжить</button>
  </div>

  <!-- Левелап -->
  <div id="levelOverlay" class="overlay">
    <h1>УРОВЕНЬ <span id="lvlNum">2</span>!</h1>
    <h2>Выберите улучшение</h2>
    <div id="cards"></div>
  </div>

  <!-- Game Over -->
  <div id="gameOverOverlay" class="overlay">
    <h1>ВЫ ПОГИБЛИ</h1>
    <p>Время: <span id="goTime">00:00</span></p>
    <p>Убийств: <span id="goKills">0</span></p>
    <p>Уровень: <span id="goLevel">1</span></p>
    <button id="restartBtn" class="btn">В лагерь</button>
  </div>

  <!-- Скрипты -->
  <script src="js/constants.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/map.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/metaprogress.js"></script>
  <script src="js/loot.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/sprites_items.js"></script>
  <script src="js/enemies.js"></script>
  <script src="js/enemies_new.js"></script>
  <script src="js/constants_step12.js"></script>
  <script src="js/enemies_step12.js"></script>
  <script src="js/bosses.js"></script>
  <script src="js/constants_expansion.js"></script>
  <script src="js/enemies_expansion.js"></script>
  <script src="js/bosses_expansion.js"></script>
  <script src="js/sprites_expansion.js"></script>
  <script src="js/sprites_step12.js"></script>
  <script src="js/weapons.js"></script>
  <script src="js/abilities.js"></script>
  <script src="js/evolutions.js"></script>
  <script src="js/weapons_extended.js"></script>
  <script src="js/puzzles.js"></script>
  <script src="js/traps_extended.js"></script>
  <script src="js/classes.js"></script>
  <script src="js/bestiary.js"></script>
  <script src="js/bestiary_expansion.js"></script>
  <script src="js/codex.js"></script>
  <script src="js/input.js"></script>
  <script src="js/player.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/ui_extended.js"></script>
  <script src="js/campaign.js"></script>
  <script src="js/urns.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
