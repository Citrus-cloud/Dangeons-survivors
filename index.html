<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Viewport: полноэкранный режим, без масштабирования (мобильная игра) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <!-- PWA: разрешить запуск как standalone-приложение -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <!-- Цвет темы браузера (тёмно-коричневый фэнтези) -->
  <meta name="theme-color" content="#1a1210" />
  <meta name="description" content="Dungeon Survivors: D20 — Bullet Heaven in a D&D setting" />
  <title>Dungeon Survivors — D20</title>

  <!-- Стили -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Capacitor (нативная обёртка — подключается только в нативной сборке через capacitor.config.json) -->
  <!-- В браузерном режиме не загружаем CDN-версию, чтобы избежать блокировки и конфликтов -->
  <script>
    // Stub: если Capacitor не определён нативной обёрткой, ничего не делаем
    if (!window.Capacitor) { window.Capacitor = null; }
  </script>

  <!-- Иконки (программно заменяются через IconGenerator при загрузке) -->
  <link rel="icon" id="favicon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" id="touchIcon" href="icon.svg" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json" />
</head>
<body>

  <!-- ============================================================
       TITLE SCREEN — Титульный экран (первый запуск)
       Показывается один раз, затем пропускается.
       ============================================================ -->
  <div id="titleScreen">
    <div class="title-bg-pattern"></div>
    <div class="title-runes" id="titleRunes"></div>
    <div class="title-logo">
      <div class="title-main" data-i18n="title_main">Dungeon Survivors</div>
      <div class="title-sub" data-i18n="title_sub">D20</div>
    </div>
    <div class="title-tap" data-i18n="title_tap">Tap to start</div>
  </div>

  <!-- ============================================================
       LOADING SCREEN — Экран загрузки (переход между картами)
       Показывает анимацию кубика d20.
       ============================================================ -->
  <div id="loadingScreen">
    <div class="loading-die" id="loadingDie">20</div>
    <div class="loading-text" data-i18n="loading">Loading...</div>
  </div>

  <!-- ============================================================
       GAME CANVAS — Основной игровой холст
       Рендер: карта, герой, враги, снаряды, эффекты.
       ============================================================ -->
  <canvas id="game"></canvas>

  <!-- ============================================================
       HUD — Игровой интерфейс (поверх canvas)
       Включает: HP/XP бары, кулдаун, счётчики, кнопку паузы.
       ============================================================ -->
  <div id="hud">
    <!-- Левый верхний угол: бары здоровья и опыта -->
    <div class="hud-top-left">
      <div id="hpBar" class="bar"><div class="fill"></div><div class="label" data-i18n="hud_hp">HP: 100/100</div></div>
      <div id="xpBar" class="bar"><div class="fill"></div><div class="label xp-level-label"></div></div>
      <!-- Мини-иконка кулдауна Magic Missile -->
      <div class="mini-cd-row">
        <div id="cdMissile" class="mini-cd"><div class="cd-fill"></div><div class="cd-icon">✦</div></div>
      </div>
    </div>
    <!-- Правый верхний угол: пауза, статистика -->
    <div class="hud-top-right">
      <button id="pauseBtn" data-i18n="hud_pause_btn">⏸</button>
      <div id="killCount" data-i18n="hud_kills">Kills: 0</div>
      <div id="runTimer">00:00</div>
      <div id="waveInfo" data-i18n="hud_wave">Wave 1 in 20s</div>
    </div>
  </div>

  <!-- ============================================================
       SLOTS — Слоты оружия (слева) и пассивок (справа)
       Динамически заполняются из Player.weaponSlots/abilitySlots.
       ============================================================ -->
  <div id="weaponSlots"  class="slot-col left"></div>
  <div id="abilitySlots" class="slot-col right"></div>

  <!-- ============================================================
       JOYSTICK — Динамический виртуальный джойстик (мобильные)
       Появляется в точке касания, скрывается при отпускании.
       ============================================================ -->
  <div id="joystick"><div class="stick"></div></div>

  <!-- ============================================================
       OVERLAYS — Оверлеи состояний игры
       ============================================================ -->

  <!-- Главное меню (legacy, скрыто по умолчанию) -->
  <div id="menuOverlay" class="overlay">
    <h1 data-i18n="title_main">DUNGEON SURVIVORS</h1>
    <h2 data-i18n="title_sub">D20</h2>
    <p data-i18n="menu_controls">Touch — dynamic joystick. PC: WASD/Arrows.</p>
    <button id="startBtn" class="btn" data-i18n="menu_start">START</button>
  </div>

  <!-- Пауза -->
  <div id="pauseOverlay" class="overlay">
    <h1 data-i18n="pause_title">PAUSED</h1>
    <button id="resumeBtn" class="btn" data-i18n="pause_resume">Resume</button>
  </div>

  <!-- Выбор улучшения при повышении уровня -->
  <div id="levelOverlay" class="overlay">
    <h1><span id="lvlNum">LEVEL 2</span></h1>
    <h2 data-i18n="levelup_choose">Choose an upgrade</h2>
    <div id="cards"></div>
  </div>

  <!-- Экран смерти (Game Over) -->
  <div id="gameOverOverlay" class="overlay">
    <h1 data-i18n="death_title">YOU DIED</h1>
    <p><span data-i18n="stats_time">Time</span>: <span id="goTime">00:00</span></p>
    <p><span data-i18n="stats_kills">Kills</span>: <span id="goKills">0</span></p>
    <p><span data-i18n="stats_level">Level</span>: <span id="goLevel">1</span></p>
    <button id="restartBtn" class="btn" data-i18n="death_restart">To camp</button>
  </div>

  <!-- ============================================================
       MONETIZATION UI — Кнопки рекламы (поверх canvas)
       Показываются в нужные моменты через MonetizationManager.
       ============================================================ -->
  <div id="monetization-ui">
    <!-- Revive via ad button (death screen) -->
    <button id="adReviveBtn" class="ad-button ad-revive" onclick="Monetization.handleRevive()">
      <span class="ad-btn-icon">▶️</span>
      <span class="ad-btn-text" data-i18n="ad_revive">Revive</span>
    </button>
    <!-- Double gold via ad button (results screen) -->
    <button id="adDoubleGoldBtn" class="ad-button ad-double" onclick="Monetization.handleDoubleGold()">
      <span class="ad-btn-icon">▶️</span>
      <span class="ad-btn-text" data-i18n="ad_double_gold">×2 Gold</span>
    </button>
    <!-- Remove ads button (settings / camp) -->
    <button id="noAdsBtn" class="ad-button ad-noads" onclick="Monetization.purchaseNoAds()">
      <span class="ad-btn-icon">🚫</span>
      <span class="ad-btn-text" data-i18n="ad_remove">Remove Ads</span>
    </button>
  </div>

  <!-- ============================================================
       SCRIPTS — Порядок загрузки скриптов (критичен!)
       
       Порядок:
       1. Утилиты (error-handler, safe-storage)
       2. Локализация (i18n engine + словари)
       3. Конфигурация (constants, biome-fixes)
       4. Вспомогательные утилиты (render-cache, spatial-grid, performance)
       5. Аудио
       6. Карта (dungeon-generator, traps, pathfinding)
       7. Системы (particles, loot, sprites, enemies, bosses, weapons...)
       8. Мета (metaprogress, classes, bestiary, codex)
       9. Ввод (input)
       10. Игрок (player)
       11. UI (hud, overlays)
       12. Кампания и урны
       13. Ядро (registry, game-loop, state-machine — последними!)
       ============================================================ -->

  <!-- 1. Утилиты -->
  <script src="js/utils/error-handler.js"></script>
  <script src="js/utils/safe-storage.js"></script>

  <!-- 2. Локализация -->
  <script src="js/i18n/engine.js"></script>
  <script src="js/i18n/locale-ru.js"></script>
  <script src="js/i18n/locale-en.js"></script>

  <!-- 3. Конфигурация -->
  <script src="js/config/constants.js"></script>
  <script src="js/config/biome-fixes.js"></script>

  <!-- 4. Вспомогательные утилиты -->
  <script src="js/utils/render-cache.js"></script>
  <script src="js/utils/spatial-grid.js"></script>
  <script src="js/utils/performance.js"></script>

  <!-- 5. Аудио -->
  <script src="js/audio/audio.js"></script>

  <!-- 6. Карта -->
  <script src="js/map/dungeon-generator.js"></script>
  <script src="js/map/traps.js"></script>
  <script src="js/map/pathfinding.js"></script>
  <script src="js/map/static-map.js"></script>
  <script src="js/map/story-maps.js"></script>

  <!-- 7. Системы и сущности -->
  <script src="js/systems/particles.js"></script>
  <script src="js/systems/achievements.js"></script>
  <script src="js/meta/metaprogress.js"></script>
  <script src="js/systems/loot.js"></script>
  <script src="js/render/sprites-enemies.js"></script>
  <script src="js/render/sprites-items.js"></script>
  <script src="js/render/sprites-expansion.js"></script>
  <script src="js/entities/enemies.js"></script>
  <script src="js/entities/bosses.js"></script>
  <script src="js/systems/weapons.js"></script>
  <script src="js/systems/abilities.js"></script>
  <script src="js/systems/evolutions.js"></script>
  <script src="js/systems/upgrade-descriptions.js"></script>
  <script src="js/systems/puzzles.js"></script>

  <!-- 8. Мета-системы -->
  <script src="js/meta/classes.js"></script>
  <script src="js/meta/bestiary.js"></script>
  <script src="js/meta/codex.js"></script>

  <!-- 9. Ввод -->
  <script src="js/input/input.js"></script>

  <!-- 10. Игрок -->
  <script src="js/entities/player.js"></script>

  <!-- 11. UI -->
  <script src="js/ui/hud.js"></script>
  <script src="js/ui/overlays.js"></script>
  <script src="js/ui/tutorial.js"></script>

  <!-- 12. Кампания и урны -->
  <script src="js/story-campaign.js"></script>
  <script src="js/meta/campaign.js"></script>
  <script src="js/systems/urns.js"></script>

  <!-- 12.5. Монетизация (после UI, перед ядром) -->
  <script src="js/monetization.js"></script>

  <!-- 13. Ядро (загружается последним!) -->
  <script src="js/core/pool.js"></script>
  <script src="js/core/registry.js"></script>
  <script src="js/core/game-loop.js"></script>
  <script src="js/core/state-machine.js"></script>

</body>
</html>
