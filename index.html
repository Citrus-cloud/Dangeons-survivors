<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Dungeon Survivors — MVP</title>
<style>
  /* ============================================================
     STYLES (later -> styles.css)
     ============================================================ */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #game { display: block; width: 100vw; height: 100vh; background: #2a2a2a; }

  /* HUD */
  #hud {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 5;
  }
  .hud-top-left {
    position: absolute; top: 10px; left: 10px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .bar {
    width: 220px; height: 16px;
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.5);
    position: relative; overflow: hidden;
    border-radius: 3px;
  }
  .bar > .fill {
    position: absolute; top: 0; left: 0; bottom: 0;
    transition: width 0.12s linear;
  }
  .bar > .label {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; text-shadow: 1px 1px 0 #000;
    letter-spacing: 0.5px;
  }
  #hpBar .fill { background: #c0392b; width: 100%; }
  #xpBar .fill { background: #2980d9; width: 0%; }

  .cd-row { display: flex; gap: 6px; margin-top: 2px; }
  .cd {
    width: 36px; height: 36px;
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.5);
    position: relative; overflow: hidden; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .cd > .cd-fill {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,0.18);
    height: 0%;
  }
  .cd > .cd-icon { position: relative; z-index: 1; }

  .hud-top-right {
    position: absolute; top: 10px; right: 10px;
    text-align: right;
    display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
    font-size: 14px;
    text-shadow: 1px 1px 0 #000;
  }
  #pauseBtn {
    pointer-events: auto;
    width: 40px; height: 40px;
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.5);
    color: #fff;
    font-family: inherit;
    font-size: 18px;
    cursor: pointer;
    border-radius: 4px;
  }
  #pauseBtn:active { background: rgba(255,255,255,0.15); }

  /* Joystick */
  #joystick {
    position: fixed;
    left: 30px; bottom: 30px;
    width: 140px; height: 140px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: 2px solid rgba(255,255,255,0.25);
    z-index: 6;
    pointer-events: auto;
    touch-action: none;
  }
  #joystick .stick {
    position: absolute; left: 50%; top: 50%;
    width: 60px; height: 60px;
    margin-left: -30px; margin-top: -30px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    border: 2px solid rgba(255,255,255,0.55);
    pointer-events: none;
  }

  /* Overlays (level up / pause / game over / menu) */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.65);
    display: none;
    align-items: center; justify-content: center;
    flex-direction: column;
    z-index: 10;
    pointer-events: auto;
    padding: 20px;
  }
  .overlay.active { display: flex; }
  .overlay h1 { font-size: 28px; margin-bottom: 6px; letter-spacing: 1px; }
  .overlay h2 { font-size: 20px; margin-bottom: 16px; opacity: 0.85; }
  .overlay p { margin: 4px 0; font-size: 14px; }
  .btn {
    margin-top: 18px;
    padding: 12px 22px;
    background: #2980d9;
    color: #fff;
    border: 1px solid rgba(255,255,255,0.5);
    font-family: inherit;
    font-size: 16px;
    cursor: pointer;
    border-radius: 4px;
  }
  .btn:hover { background: #3a90e9; }
  .btn:active { background: #1f6cb8; }

  /* Level up cards */
  #cards {
    display: flex; gap: 14px; margin-top: 10px;
    flex-wrap: wrap; justify-content: center;
  }
  .card {
    width: 200px; min-height: 160px;
    background: #1c1c1c;
    border: 2px solid #555;
    border-radius: 6px;
    padding: 14px;
    cursor: pointer;
    display: flex; flex-direction: column;
    transition: transform 0.08s ease, border-color 0.12s ease;
  }
  .card:hover { border-color: #2980d9; transform: translateY(-3px); }
  .card .card-title { font-size: 15px; font-weight: bold; margin-bottom: 8px; color: #ffe084; }
  .card .card-desc  { font-size: 13px; line-height: 1.35; color: #ddd; }

  @media (max-width: 480px) {
    #joystick { width: 120px; height: 120px; left: 20px; bottom: 20px; }
    #joystick .stick { width: 52px; height: 52px; margin-left: -26px; margin-top: -26px; }
    .bar { width: 170px; }
    .card { width: 90%; min-height: 110px; }
  }
</style>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-top-left">
      <div id="hpBar" class="bar"><div class="fill"></div><div class="label">HP: 100/100</div></div>
      <div id="xpBar" class="bar"><div class="fill"></div><div class="label">XP: 0/100</div></div>
      <div class="cd-row">
        <div id="cdSword" class="cd"><div class="cd-fill"></div><div class="cd-icon">⚔</div></div>
        <div id="cdMissile" class="cd"><div class="cd-fill"></div><div class="cd-icon">✦</div></div>
      </div>
    </div>
    <div class="hud-top-right">
      <button id="pauseBtn" title="Пауза">||</button>
      <div id="killCount">Убийств: 0</div>
      <div id="runTimer">00:00</div>
      <div id="waveInfo">Волна 1 через 20с</div>
    </div>
  </div>

  <!-- Joystick -->
  <div id="joystick"><div class="stick"></div></div>

  <!-- Menu Overlay -->
  <div id="menuOverlay" class="overlay active">
    <h1>DUNGEON SURVIVORS</h1>
    <h2>MVP — Шаг 1</h2>
    <p>Двигайтесь джойстиком (слева внизу) или WASD/стрелками.</p>
    <p>Атаки автоматические. Собирайте кристаллы опыта.</p>
    <button id="startBtn" class="btn">НАЧАТЬ</button>
  </div>

  <!-- Pause Overlay -->
  <div id="pauseOverlay" class="overlay">
    <h1>ПАУЗА</h1>
    <button id="resumeBtn" class="btn">Продолжить</button>
  </div>

  <!-- Level Up Overlay -->
  <div id="levelOverlay" class="overlay">
    <h1>УРОВЕНЬ <span id="lvlNum">2</span>!</h1>
    <h2>Выберите улучшение</h2>
    <div id="cards"></div>
  </div>

  <!-- Game Over Overlay -->
  <div id="gameOverOverlay" class="overlay">
    <h1>ВЫ ПОГИБЛИ</h1>
    <p>Время: <span id="goTime">00:00</span></p>
    <p>Убийств: <span id="goKills">0</span></p>
    <p>Уровень: <span id="goLevel">1</span></p>
    <button id="restartBtn" class="btn">Начать заново</button>
  </div>

<script>
'use strict';
/* ==============================================================
   DUNGEON SURVIVORS — MVP (Шаг 1)
   Один файл, но код разделён на логические "модули".
   Будущее разделение:
     - config.js     (CONFIG)
     - input.js      (Input, Joystick)
     - entities/*.js (Player, Enemy, Projectile, XPCrystal, Particle)
     - pool.js       (ObjectPool)
     - spawner.js    (WaveSpawner)
     - upgrades.js   (UPGRADES)
     - ui.js         (HUD, Overlays)
     - game.js       (Game loop, state machine)
   ============================================================== */


/* ============================================================
   MODULE: CONFIG
   ============================================================ */
const CONFIG = {
  MAP: { W: 2000, H: 2000, TILE_SIZE: 80 },

  PLAYER: {
    SIZE: 32,
    SPEED: 180,             // px/sec
    MAX_HP: 100,
    PICKUP_RADIUS: 40,
    TRAIL_INTERVAL: 0.05,   // sec between trail particles
  },

  SWORD: {
    COOLDOWN: 0.8,          // sec
    RADIUS: 60,             // px detection
    DAMAGE: 15,
    SWING_DURATION: 0.18,   // visual only
    ARC: Math.PI * 0.9,     // ~162°
  },

  MISSILE: {
    COOLDOWN: 3.0,          // sec
    SPEED: 380,
    DAMAGE: 25,
    RADIUS: 6,
    LIFETIME: 3.0,
    COUNT: 1,               // upgradeable
    SPREAD: 0.25,           // rad between extra missiles
  },

  ENEMY: {
    SIZE: 28,
    SPEED: 110,             // a bit slower than player
    HP: 20,
    DAMAGE: 10,             // contact damage
    HIT_INTERVAL: 0.6,      // sec between contact damage ticks
    XP_MIN: 5,
    XP_MAX: 10,
  },

  WAVE: {
    INTERVAL: 20,           // sec
    BASE: 3,
    PER_WAVE: 2,
    SPAWN_DIST_MIN: 400,
    SPAWN_DIST_MAX: 600,
    INITIAL_DELAY: 1.5,     // wave 1 spawns shortly after start
  },

  XP: {
    BASE: 100,
    GROWTH: 1.5,
    MAGNET_SPEED: 360,
  },

  POOLS: {
    ENEMIES: 80,
    PROJECTILES: 50,
    PARTICLES: 100,
    XP: 200,
  },
};


/* ============================================================
   MODULE: UTILS
   ============================================================ */
const Utils = {
  clamp(v, a, b) { return v < a ? a : (v > b ? b : v); },
  lerp(a, b, t) { return a + (b - a) * t; },
  rand(a, b) { return a + Math.random() * (b - a); },
  randInt(a, b) { return Math.floor(Utils.rand(a, b + 1)); },
  dist2(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; },
  len(x, y) { return Math.hypot(x, y); },
  norm(x, y) { const l = Math.hypot(x, y) || 1; return { x: x / l, y: y / l }; },
  formatTime(sec) {
    const s = Math.max(0, Math.floor(sec));
    const m = Math.floor(s / 60);
    const ss = s % 60;
    return String(m).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
  },
};


/* ============================================================
   MODULE: OBJECT POOL
   Generic pool. Each item has .active flag.
   ============================================================ */
class ObjectPool {
  constructor(factory, size) {
    this.items = new Array(size);
    for (let i = 0; i < size; i++) this.items[i] = factory();
  }
  spawn() {
    for (let i = 0, n = this.items.length; i < n; i++) {
      const it = this.items[i];
      if (!it.active) { it.active = true; return it; }
    }
    return null; // pool exhausted -> simply skip
  }
  forEachActive(fn) {
    for (let i = 0, n = this.items.length; i < n; i++) {
      const it = this.items[i];
      if (it.active) fn(it, i);
    }
  }
  countActive() {
    let c = 0;
    for (let i = 0; i < this.items.length; i++) if (this.items[i].active) c++;
    return c;
  }
  clearAll() { for (const it of this.items) it.active = false; }
}


/* ============================================================
   MODULE: ENTITIES (factories — keep allocation low)
   ============================================================ */
function createEnemy() {
  return {
    active: false,
    x: 0, y: 0,
    vx: 0, vy: 0,
    hp: 0, maxHp: 0,
    hitCooldown: 0,
    flash: 0,
  };
}
function createProjectile() {
  return {
    active: false,
    x: 0, y: 0,
    vx: 0, vy: 0,
    life: 0,
    damage: 0,
    radius: CONFIG.MISSILE.RADIUS,
  };
}
function createXP() {
  return {
    active: false,
    x: 0, y: 0,
    value: 0,
    pulse: 0,
  };
}
function createParticle() {
  return {
    active: false,
    x: 0, y: 0,
    vx: 0, vy: 0,
    life: 0, maxLife: 0,
    color: '#888',
    size: 3,
  };
}


/* ============================================================
   MODULE: INPUT (Keyboard + Virtual Joystick)
   ============================================================ */
const Input = {
  keys: Object.create(null),
  joystick: { active: false, dx: 0, dy: 0 },

  init() {
    // Keyboard
    window.addEventListener('keydown', (e) => {
      this.keys[e.code] = true;
      if (e.code === 'KeyP' || e.code === 'Escape') Game.togglePause();
    });
    window.addEventListener('keyup', (e) => { this.keys[e.code] = false; });

    // Virtual joystick (pointer events for mouse + touch)
    const joy = document.getElementById('joystick');
    const stick = joy.querySelector('.stick');
    let activeId = null;
    let center = { x: 0, y: 0 };
    let radius = 0;

    const updateGeometry = () => {
      const r = joy.getBoundingClientRect();
      center.x = r.left + r.width / 2;
      center.y = r.top + r.height / 2;
      radius = r.width / 2;
    };

    const onDown = (e) => {
      if (activeId !== null) return;
      activeId = e.pointerId;
      joy.setPointerCapture(activeId);
      updateGeometry();
      this.joystick.active = true;
      onMove(e);
    };
    const onMove = (e) => {
      if (e.pointerId !== activeId) return;
      const dx = e.clientX - center.x;
      const dy = e.clientY - center.y;
      const len = Math.hypot(dx, dy);
      const max = radius;
      const clamped = Math.min(len, max);
      const nx = len > 0 ? dx / len : 0;
      const ny = len > 0 ? dy / len : 0;
      const ix = nx * clamped;
      const iy = ny * clamped;
      stick.style.transform = `translate(${ix}px, ${iy}px)`;
      // normalized -1..1
      this.joystick.dx = ix / max;
      this.joystick.dy = iy / max;
    };
    const onUp = (e) => {
      if (e.pointerId !== activeId) return;
      try { joy.releasePointerCapture(activeId); } catch (_) {}
      activeId = null;
      this.joystick.active = false;
      this.joystick.dx = 0;
      this.joystick.dy = 0;
      stick.style.transform = 'translate(0px, 0px)';
    };
    joy.addEventListener('pointerdown', onDown);
    joy.addEventListener('pointermove', onMove);
    joy.addEventListener('pointerup', onUp);
    joy.addEventListener('pointercancel', onUp);
    joy.addEventListener('pointerleave', onUp);
  },

  /** Returns intended movement vector (normalized, length 0..1). */
  getMove() {
    let dx = 0, dy = 0;
    // Joystick has priority
    if (this.joystick.active && (this.joystick.dx !== 0 || this.joystick.dy !== 0)) {
      dx = this.joystick.dx;
      dy = this.joystick.dy;
    } else {
      if (this.keys['KeyW'] || this.keys['ArrowUp'])    dy -= 1;
      if (this.keys['KeyS'] || this.keys['ArrowDown'])  dy += 1;
      if (this.keys['KeyA'] || this.keys['ArrowLeft'])  dx -= 1;
      if (this.keys['KeyD'] || this.keys['ArrowRight']) dx += 1;
      const l = Math.hypot(dx, dy);
      if (l > 1) { dx /= l; dy /= l; }
    }
    return { x: dx, y: dy };
  },
};


/* ============================================================
   MODULE: UPGRADES
   ============================================================ */
const UPGRADES = [
  {
    id: 'maxhp',
    title: 'Здоровье +20',
    desc: 'Максимальное HP +20 (восполняется на ту же величину).',
    apply(p) { p.maxHp += 20; p.hp = Math.min(p.maxHp, p.hp + 20); },
  },
  {
    id: 'damage',
    title: 'Урон +15%',
    desc: 'Весь урон увеличен на 15%.',
    apply(p) { p.damageMul *= 1.15; },
  },
  {
    id: 'speed',
    title: 'Скорость +10%',
    desc: 'Скорость передвижения +10%.',
    apply(p) { p.speedMul *= 1.10; },
  },
  {
    id: 'sword_cd',
    title: 'Скорострельность меча',
    desc: 'Кулдаун меча уменьшается на 15%.',
    apply(p) { p.swordCdMul *= 0.85; },
  },
  {
    id: 'missile_cd',
    title: 'Магия чаще',
    desc: 'Частота магических снарядов: кулдаун -25%.',
    apply(p) { p.missileCdMul *= 0.75; },
  },
  {
    id: 'pickup',
    title: 'Радиус подбора +30%',
    desc: 'Радиус притяжения опыта +30%.',
    apply(p) { p.pickupMul *= 1.30; },
  },
  {
    id: 'multishot',
    title: '+1 снаряд',
    desc: 'Magic Missile выпускает на 1 снаряд больше.',
    apply(p) { p.missileCount += 1; },
  },
  {
    id: 'heal',
    title: 'Восстановление 30%',
    desc: 'Мгновенно восполняет 30% максимального HP.',
    apply(p) { p.hp = Math.min(p.maxHp, p.hp + p.maxHp * 0.30); },
  },
];

function pickRandomUpgrades(n) {
  const pool = UPGRADES.slice();
  const result = [];
  for (let i = 0; i < n && pool.length > 0; i++) {
    const idx = Math.floor(Math.random() * pool.length);
    result.push(pool.splice(idx, 1)[0]);
  }
  return result;
}


/* ============================================================
   MODULE: GAME (state machine, loop, world)
   ============================================================ */
const Game = {
  // canvas
  canvas: null, ctx: null,
  viewW: 0, viewH: 0,
  dpr: 1,

  // state: 'menu' | 'playing' | 'paused' | 'levelup' | 'gameover'
  state: 'menu',

  // world
  player: null,
  enemies: null,
  projectiles: null,
  xpDrops: null,
  particles: null,

  // timing
  lastTs: 0,
  runTime: 0,
  waveIndex: 0,
  waveTimer: 0,
  kills: 0,

  // visuals
  swordSwing: { active: false, t: 0, angle: 0 },

  // tile cache (precomputed positions for performance)
  tilePositions: [],

  init() {
    this.canvas = document.getElementById('game');
    this.ctx = this.canvas.getContext('2d');
    this.resize();
    window.addEventListener('resize', () => this.resize());

    // Pools
    this.enemies     = new ObjectPool(createEnemy,     CONFIG.POOLS.ENEMIES);
    this.projectiles = new ObjectPool(createProjectile, CONFIG.POOLS.PROJECTILES);
    this.xpDrops     = new ObjectPool(createXP,         CONFIG.POOLS.XP);
    this.particles   = new ObjectPool(createParticle,   CONFIG.POOLS.PARTICLES);

    // Tile texture: precompute pseudo-random highlighted tiles
    this.precomputeTiles();

    // Input
    Input.init();

    // UI bindings
    document.getElementById('startBtn').addEventListener('click', () => this.startNewGame());
    document.getElementById('restartBtn').addEventListener('click', () => this.startNewGame());
    document.getElementById('resumeBtn').addEventListener('click', () => this.togglePause());
    document.getElementById('pauseBtn').addEventListener('click', () => this.togglePause());

    // Start render loop (renders even in menu — but draws nothing meaningful then)
    this.lastTs = performance.now();
    requestAnimationFrame((t) => this.loop(t));
  },

  resize() {
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth;
    const h = window.innerHeight;
    this.viewW = w;
    this.viewH = h;
    this.canvas.width = Math.floor(w * this.dpr);
    this.canvas.height = Math.floor(h * this.dpr);
    this.canvas.style.width = w + 'px';
    this.canvas.style.height = h + 'px';
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
  },

  precomputeTiles() {
    // pseudo-random fixed seed by hashing tile coords
    const ts = CONFIG.MAP.TILE_SIZE;
    const cols = Math.ceil(CONFIG.MAP.W / ts);
    const rows = Math.ceil(CONFIG.MAP.H / ts);
    this.tilePositions.length = 0;
    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        // simple hash
        const h = ((i * 73856093) ^ (j * 19349663)) >>> 0;
        if ((h % 7) === 0) {
          this.tilePositions.push({ x: i * ts, y: j * ts, w: ts, h: ts });
        }
      }
    }
  },

  /* ----- state transitions ----- */
  startNewGame() {
    // Reset world
    this.enemies.clearAll();
    this.projectiles.clearAll();
    this.xpDrops.clearAll();
    this.particles.clearAll();
    this.kills = 0;
    this.runTime = 0;
    this.waveIndex = 0;
    this.waveTimer = CONFIG.WAVE.INITIAL_DELAY;

    this.player = {
      x: CONFIG.MAP.W / 2,
      y: CONFIG.MAP.H / 2,
      size: CONFIG.PLAYER.SIZE,
      hp: CONFIG.PLAYER.MAX_HP,
      maxHp: CONFIG.PLAYER.MAX_HP,
      // multipliers (so upgrades stack relative)
      speedMul: 1,
      damageMul: 1,
      swordCdMul: 1,
      missileCdMul: 1,
      pickupMul: 1,
      // counters
      swordCd: 0,
      missileCd: 0,
      missileCount: CONFIG.MISSILE.COUNT,
      // facing (last move direction)
      facing: { x: 1, y: 0 },
      // xp/level
      level: 1,
      xp: 0,
      xpNext: CONFIG.XP.BASE,
      // visuals
      trailTimer: 0,
    };

    this.swordSwing.active = false;

    UI.hideAll();
    this.state = 'playing';
  },

  togglePause() {
    if (this.state === 'playing') {
      this.state = 'paused';
      UI.showPause();
    } else if (this.state === 'paused') {
      this.state = 'playing';
      UI.hideAll();
    }
  },

  triggerLevelUp() {
    this.state = 'levelup';
    const choices = pickRandomUpgrades(3);
    UI.showLevelUp(this.player.level, choices, (chosen) => {
      chosen.apply(this.player);
      UI.hideAll();
      this.state = 'playing';
    });
  },

  triggerGameOver() {
    this.state = 'gameover';
    UI.showGameOver({
      time: Utils.formatTime(this.runTime),
      kills: this.kills,
      level: this.player.level,
    });
  },

  /* ----- main loop ----- */
  loop(ts) {
    const dt = Math.min(0.05, (ts - this.lastTs) / 1000); // clamp to avoid tunneling
    this.lastTs = ts;

    if (this.state === 'playing') {
      this.update(dt);
    }
    this.render();
    UI.tick(this);

    requestAnimationFrame((t) => this.loop(t));
  },

  /* ----- UPDATE ----- */
  update(dt) {
    this.runTime += dt;

    this.updatePlayer(dt);
    this.updateWaves(dt);
    this.updateEnemies(dt);
    this.updateCombat(dt);
    this.updateProjectiles(dt);
    this.updateXP(dt);
    this.updateParticles(dt);

    // Check level up
    if (this.player.xp >= this.player.xpNext) {
      this.player.xp -= this.player.xpNext;
      this.player.level += 1;
      this.player.xpNext = Math.floor(CONFIG.XP.BASE * Math.pow(CONFIG.XP.GROWTH, this.player.level - 1));
      this.triggerLevelUp();
    }

    // Death
    if (this.player.hp <= 0) {
      this.player.hp = 0;
      this.triggerGameOver();
    }
  },

  updatePlayer(dt) {
    const p = this.player;
    const move = Input.getMove();
    const speed = CONFIG.PLAYER.SPEED * p.speedMul;
    const ml = Math.hypot(move.x, move.y);
    if (ml > 0.001) {
      p.x += move.x * speed * dt;
      p.y += move.y * speed * dt;
      p.facing.x = move.x / ml;
      p.facing.y = move.y / ml;

      // trail particle
      p.trailTimer -= dt;
      if (p.trailTimer <= 0) {
        p.trailTimer = CONFIG.PLAYER.TRAIL_INTERVAL;
        const tp = this.particles.spawn();
        if (tp) {
          tp.x = p.x; tp.y = p.y;
          tp.vx = -move.x * 20 + Utils.rand(-10, 10);
          tp.vy = -move.y * 20 + Utils.rand(-10, 10);
          tp.life = tp.maxLife = 0.35;
          tp.color = 'rgba(120,170,255,0.5)';
          tp.size = 4;
        }
      }
    }
    // Clamp to map
    const half = p.size / 2;
    p.x = Utils.clamp(p.x, half, CONFIG.MAP.W - half);
    p.y = Utils.clamp(p.y, half, CONFIG.MAP.H - half);

    // cooldowns
    p.swordCd   = Math.max(0, p.swordCd - dt);
    p.missileCd = Math.max(0, p.missileCd - dt);

    // sword swing visual timer
    if (this.swordSwing.active) {
      this.swordSwing.t += dt;
      if (this.swordSwing.t >= CONFIG.SWORD.SWING_DURATION) this.swordSwing.active = false;
    }
  },

  updateWaves(dt) {
    this.waveTimer -= dt;
    if (this.waveTimer <= 0) {
      this.waveIndex += 1;
      const count = CONFIG.WAVE.BASE + this.waveIndex * CONFIG.WAVE.PER_WAVE;
      this.spawnWave(count);
      this.waveTimer = CONFIG.WAVE.INTERVAL;
    }
  },

  spawnWave(count) {
    for (let i = 0; i < count; i++) {
      const e = this.enemies.spawn();
      if (!e) break;
      const angle = Math.random() * Math.PI * 2;
      const dist = Utils.rand(CONFIG.WAVE.SPAWN_DIST_MIN, CONFIG.WAVE.SPAWN_DIST_MAX);
      let ex = this.player.x + Math.cos(angle) * dist;
      let ey = this.player.y + Math.sin(angle) * dist;
      // clamp to map (so they spawn inside world)
      const m = CONFIG.ENEMY.SIZE;
      ex = Utils.clamp(ex, m, CONFIG.MAP.W - m);
      ey = Utils.clamp(ey, m, CONFIG.MAP.H - m);
      e.x = ex; e.y = ey;
      e.vx = 0; e.vy = 0;
      e.hp = e.maxHp = CONFIG.ENEMY.HP;
      e.hitCooldown = 0;
      e.flash = 0;
    }
  },

  updateEnemies(dt) {
    const p = this.player;
    const speed = CONFIG.ENEMY.SPEED;
    const enemies = this.enemies.items;
    for (let i = 0, n = enemies.length; i < n; i++) {
      const e = enemies[i];
      if (!e.active) continue;
      // chase
      const dx = p.x - e.x, dy = p.y - e.y;
      const d = Math.hypot(dx, dy) || 1;
      e.vx = dx / d * speed;
      e.vy = dy / d * speed;
      e.x += e.vx * dt;
      e.y += e.vy * dt;
      e.hitCooldown = Math.max(0, e.hitCooldown - dt);
      e.flash = Math.max(0, e.flash - dt);

      // contact damage to player
      const collideR = (CONFIG.ENEMY.SIZE + CONFIG.PLAYER.SIZE) * 0.5;
      if (d < collideR && e.hitCooldown <= 0) {
        p.hp -= CONFIG.ENEMY.DAMAGE;
        e.hitCooldown = CONFIG.ENEMY.HIT_INTERVAL;
      }

      // very light separation: push out from each other (cheap O(n^2) up to 80, OK)
      // Skip detailed separation in MVP to save CPU.
    }
  },

  updateCombat(dt) {
    const p = this.player;

    /* SWORD */
    if (p.swordCd <= 0) {
      const target = this.findNearestEnemy(p.x, p.y, CONFIG.SWORD.RADIUS);
      if (target) {
        const damage = CONFIG.SWORD.DAMAGE * p.damageMul;
        // AoE arc: damage all enemies within radius and within arc towards target
        const dirAngle = Math.atan2(target.y - p.y, target.x - p.x);
        const halfArc = CONFIG.SWORD.ARC * 0.5;
        const r2 = CONFIG.SWORD.RADIUS * CONFIG.SWORD.RADIUS;
        const enemies = this.enemies.items;
        for (let i = 0; i < enemies.length; i++) {
          const e = enemies[i];
          if (!e.active) continue;
          const dx = e.x - p.x, dy = e.y - p.y;
          if (dx * dx + dy * dy > r2) continue;
          const a = Math.atan2(dy, dx);
          let diff = a - dirAngle;
          // wrap to [-PI, PI]
          while (diff > Math.PI)  diff -= Math.PI * 2;
          while (diff < -Math.PI) diff += Math.PI * 2;
          if (Math.abs(diff) <= halfArc) {
            this.damageEnemy(e, damage);
          }
        }
        // Visual swing
        this.swordSwing.active = true;
        this.swordSwing.t = 0;
        this.swordSwing.angle = dirAngle;

        p.swordCd = CONFIG.SWORD.COOLDOWN * p.swordCdMul;
      }
    }

    /* MAGIC MISSILE */
    if (p.missileCd <= 0) {
      // Direction
      let dir;
      const move = Input.getMove();
      if (Math.hypot(move.x, move.y) > 0.05) {
        dir = Utils.norm(move.x, move.y);
      } else {
        const t = this.findNearestEnemy(p.x, p.y, Infinity);
        if (t) {
          dir = Utils.norm(t.x - p.x, t.y - p.y);
        } else {
          dir = { x: p.facing.x, y: p.facing.y };
        }
      }
      // Multi-missile spread
      const count = p.missileCount;
      const spread = CONFIG.MISSILE.SPREAD;
      const baseAngle = Math.atan2(dir.y, dir.x);
      for (let i = 0; i < count; i++) {
        const off = (i - (count - 1) / 2) * spread;
        const a = baseAngle + off;
        this.spawnMissile(p.x, p.y, Math.cos(a), Math.sin(a), p.damageMul);
      }
      p.missileCd = CONFIG.MISSILE.COOLDOWN * p.missileCdMul;
    }
  },

  spawnMissile(x, y, dx, dy, damageMul) {
    const m = this.projectiles.spawn();
    if (!m) return;
    m.x = x; m.y = y;
    m.vx = dx * CONFIG.MISSILE.SPEED;
    m.vy = dy * CONFIG.MISSILE.SPEED;
    m.life = CONFIG.MISSILE.LIFETIME;
    m.damage = CONFIG.MISSILE.DAMAGE * damageMul;
    m.radius = CONFIG.MISSILE.RADIUS;
  },

  updateProjectiles(dt) {
    const projs = this.projectiles.items;
    const enemies = this.enemies.items;
    // off-screen deactivation bounds
    const cam = this.getCamera();
    const margin = 40;
    const minX = cam.x - margin, minY = cam.y - margin;
    const maxX = cam.x + this.viewW + margin, maxY = cam.y + this.viewH + margin;

    for (let i = 0; i < projs.length; i++) {
      const m = projs[i];
      if (!m.active) continue;
      m.x += m.vx * dt;
      m.y += m.vy * dt;
      m.life -= dt;

      if (m.life <= 0 || m.x < minX || m.x > maxX || m.y < minY || m.y > maxY) {
        m.active = false;
        continue;
      }

      // collide with enemies
      for (let j = 0; j < enemies.length; j++) {
        const e = enemies[j];
        if (!e.active) continue;
        const r = m.radius + CONFIG.ENEMY.SIZE * 0.5;
        const dx = e.x - m.x, dy = e.y - m.y;
        if (dx * dx + dy * dy <= r * r) {
          this.damageEnemy(e, m.damage);
          m.active = false;
          break;
        }
      }
    }
  },

  damageEnemy(e, damage) {
    e.hp -= damage;
    e.flash = 0.08;
    if (e.hp <= 0) {
      this.killEnemy(e);
    }
  },

  killEnemy(e) {
    e.active = false;
    this.kills += 1;
    // spawn xp drop
    const xp = this.xpDrops.spawn();
    if (xp) {
      xp.x = e.x; xp.y = e.y;
      xp.value = Utils.randInt(CONFIG.ENEMY.XP_MIN, CONFIG.ENEMY.XP_MAX);
      xp.pulse = 0;
    }
    // death particles (3-5)
    const count = Utils.randInt(3, 5);
    for (let i = 0; i < count; i++) {
      const pa = this.particles.spawn();
      if (!pa) break;
      pa.x = e.x; pa.y = e.y;
      const a = Math.random() * Math.PI * 2;
      const sp = Utils.rand(40, 110);
      pa.vx = Math.cos(a) * sp;
      pa.vy = Math.sin(a) * sp;
      pa.life = pa.maxLife = Utils.rand(0.4, 0.7);
      pa.color = '#888';
      pa.size = Utils.rand(2, 4);
    }
  },

  updateXP(dt) {
    const p = this.player;
    const pickupR = CONFIG.PLAYER.PICKUP_RADIUS * p.pickupMul;
    const pickupR2 = pickupR * pickupR;
    const collectR = (p.size * 0.5 + 6);
    const collectR2 = collectR * collectR;
    const xps = this.xpDrops.items;
    for (let i = 0; i < xps.length; i++) {
      const x = xps[i];
      if (!x.active) continue;
      x.pulse += dt;
      const dx = p.x - x.x, dy = p.y - x.y;
      const d2 = dx * dx + dy * dy;
      if (d2 <= pickupR2) {
        const d = Math.sqrt(d2) || 1;
        const speed = CONFIG.XP.MAGNET_SPEED;
        x.x += (dx / d) * speed * dt;
        x.y += (dy / d) * speed * dt;
      }
      if (d2 <= collectR2) {
        p.xp += x.value;
        x.active = false;
      }
    }
  },

  updateParticles(dt) {
    const ps = this.particles.items;
    for (let i = 0; i < ps.length; i++) {
      const p = ps[i];
      if (!p.active) continue;
      p.life -= dt;
      if (p.life <= 0) { p.active = false; continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      // mild damping
      p.vx *= 0.94;
      p.vy *= 0.94;
    }
  },

  /* ----- helpers ----- */
  findNearestEnemy(x, y, maxRadius) {
    let best = null, bestD2 = (maxRadius === Infinity ? Infinity : maxRadius * maxRadius);
    const enemies = this.enemies.items;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.active) continue;
      const dx = e.x - x, dy = e.y - y;
      const d2 = dx * dx + dy * dy;
      if (d2 < bestD2) { bestD2 = d2; best = e; }
    }
    return best;
  },

  getCamera() {
    const p = this.player;
    let cx = p.x - this.viewW / 2;
    let cy = p.y - this.viewH / 2;
    cx = Utils.clamp(cx, 0, Math.max(0, CONFIG.MAP.W - this.viewW));
    cy = Utils.clamp(cy, 0, Math.max(0, CONFIG.MAP.H - this.viewH));
    return { x: cx, y: cy };
  },

  /* ============================================================
     RENDER
     ============================================================ */
  render() {
    const ctx = this.ctx;
    // clear
    ctx.fillStyle = '#1f1f1f';
    ctx.fillRect(0, 0, this.viewW, this.viewH);

    if (!this.player) return;

    const cam = this.getCamera();
    const minX = cam.x, minY = cam.y;
    const maxX = cam.x + this.viewW, maxY = cam.y + this.viewH;

    ctx.save();
    ctx.translate(-cam.x, -cam.y);

    // floor background (dark gray)
    ctx.fillStyle = '#2a2a2a';
    ctx.fillRect(0, 0, CONFIG.MAP.W, CONFIG.MAP.H);

    // Map borders
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 2;
    ctx.strokeRect(0, 0, CONFIG.MAP.W, CONFIG.MAP.H);

    // Tiles (only those visible)
    ctx.fillStyle = '#3a3a3a';
    for (let i = 0, n = this.tilePositions.length; i < n; i++) {
      const t = this.tilePositions[i];
      if (t.x + t.w < minX || t.x > maxX || t.y + t.h < minY || t.y > maxY) continue;
      ctx.fillRect(t.x, t.y, t.w, t.h);
    }

    // XP crystals
    const xps = this.xpDrops.items;
    for (let i = 0; i < xps.length; i++) {
      const x = xps[i];
      if (!x.active) continue;
      if (x.x < minX - 20 || x.x > maxX + 20 || x.y < minY - 20 || x.y > maxY + 20) continue;
      const pulse = 1 + Math.sin(x.pulse * 6) * 0.18;
      ctx.fillStyle = '#3ddc84';
      ctx.shadowColor = 'rgba(60, 220, 132, 0.7)';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(x.x, x.y, 6 * pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // Particles (under entities)
    const parts = this.particles.items;
    for (let i = 0; i < parts.length; i++) {
      const pa = parts[i];
      if (!pa.active) continue;
      if (pa.x < minX - 10 || pa.x > maxX + 10 || pa.y < minY - 10 || pa.y > maxY + 10) continue;
      const a = Math.max(0, pa.life / pa.maxLife);
      ctx.globalAlpha = a;
      ctx.fillStyle = pa.color;
      ctx.fillRect(pa.x - pa.size * 0.5, pa.y - pa.size * 0.5, pa.size, pa.size);
      ctx.globalAlpha = 1;
    }

    // Enemies
    const enemies = this.enemies.items;
    const eSize = CONFIG.ENEMY.SIZE;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.active) continue;
      if (e.x + eSize < minX || e.x - eSize > maxX || e.y + eSize < minY || e.y - eSize > maxY) continue;

      ctx.fillStyle = e.flash > 0 ? '#ffffff' : '#c0392b';
      ctx.fillRect(e.x - eSize / 2, e.y - eSize / 2, eSize, eSize);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1;
      ctx.strokeRect(e.x - eSize / 2 + 0.5, e.y - eSize / 2 + 0.5, eSize - 1, eSize - 1);

      // Letter "S"
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 14px ui-monospace, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('S', e.x, e.y + 1);

      // HP bar (only if damaged)
      if (e.hp < e.maxHp) {
        const barW = eSize, barH = 3;
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(e.x - barW / 2, e.y - eSize / 2 - 6, barW, barH);
        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(e.x - barW / 2, e.y - eSize / 2 - 6, barW * (e.hp / e.maxHp), barH);
      }
    }

    // Player
    const p = this.player;
    const ps = p.size;
    ctx.fillStyle = '#2980d9';
    ctx.fillRect(p.x - ps / 2, p.y - ps / 2, ps, ps);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.strokeRect(p.x - ps / 2 + 1, p.y - ps / 2 + 1, ps - 2, ps - 2);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 18px ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('K', p.x, p.y + 1);

    // Sword swing arc
    if (this.swordSwing.active) {
      const t = this.swordSwing.t / CONFIG.SWORD.SWING_DURATION; // 0..1
      const alpha = (1 - t) * 0.85;
      const r = CONFIG.SWORD.RADIUS;
      const half = CONFIG.SWORD.ARC * 0.5;
      const a0 = this.swordSwing.angle - half + CONFIG.SWORD.ARC * t * 0.4;
      const a1 = this.swordSwing.angle + half + CONFIG.SWORD.ARC * t * 0.4;
      ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, a0, a1);
      ctx.stroke();
      // inner brighter line
      ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.6})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r - 4, a0, a1);
      ctx.stroke();
    }

    // Pickup radius (subtle)
    const pickupR = CONFIG.PLAYER.PICKUP_RADIUS * p.pickupMul;
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(p.x, p.y, pickupR, 0, Math.PI * 2);
    ctx.stroke();

    // Projectiles (magic missiles)
    const projs = this.projectiles.items;
    for (let i = 0; i < projs.length; i++) {
      const m = projs[i];
      if (!m.active) continue;
      if (m.x < minX - 20 || m.x > maxX + 20 || m.y < minY - 20 || m.y > maxY + 20) continue;
      // glow
      ctx.shadowColor = 'rgba(220, 180, 255, 0.9)';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#a259ff';
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      // white core
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.radius * 0.45, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  },
};


/* ============================================================
   MODULE: UI (HUD + overlays)
   ============================================================ */
const UI = {
  hpFill: null, hpLabel: null,
  xpFill: null, xpLabel: null,
  cdSwordFill: null, cdMissileFill: null,
  killCount: null, runTimer: null, waveInfo: null,
  menuOverlay: null, pauseOverlay: null, levelOverlay: null, gameOverOverlay: null,
  cardsEl: null, lvlNum: null,
  goTime: null, goKills: null, goLevel: null,

  init() {
    this.hpFill = document.querySelector('#hpBar .fill');
    this.hpLabel = document.querySelector('#hpBar .label');
    this.xpFill = document.querySelector('#xpBar .fill');
    this.xpLabel = document.querySelector('#xpBar .label');
    this.cdSwordFill   = document.querySelector('#cdSword .cd-fill');
    this.cdMissileFill = document.querySelector('#cdMissile .cd-fill');
    this.killCount = document.getElementById('killCount');
    this.runTimer  = document.getElementById('runTimer');
    this.waveInfo  = document.getElementById('waveInfo');
    this.menuOverlay     = document.getElementById('menuOverlay');
    this.pauseOverlay    = document.getElementById('pauseOverlay');
    this.levelOverlay    = document.getElementById('levelOverlay');
    this.gameOverOverlay = document.getElementById('gameOverOverlay');
    this.cardsEl = document.getElementById('cards');
    this.lvlNum  = document.getElementById('lvlNum');
    this.goTime  = document.getElementById('goTime');
    this.goKills = document.getElementById('goKills');
    this.goLevel = document.getElementById('goLevel');
  },

  hideAll() {
    this.menuOverlay.classList.remove('active');
    this.pauseOverlay.classList.remove('active');
    this.levelOverlay.classList.remove('active');
    this.gameOverOverlay.classList.remove('active');
  },

  showPause()    { this.hideAll(); this.pauseOverlay.classList.add('active'); },
  showMenu()     { this.hideAll(); this.menuOverlay.classList.add('active'); },
  showGameOver(stats) {
    this.hideAll();
    this.goTime.textContent  = stats.time;
    this.goKills.textContent = stats.kills;
    this.goLevel.textContent = stats.level;
    this.gameOverOverlay.classList.add('active');
  },

  showLevelUp(level, choices, onPick) {
    this.hideAll();
    this.lvlNum.textContent = level;
    this.cardsEl.innerHTML = '';
    choices.forEach((u) => {
      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML = `<div class="card-title">${u.title}</div><div class="card-desc">${u.desc}</div>`;
      el.addEventListener('click', () => onPick(u));
      this.cardsEl.appendChild(el);
    });
    this.levelOverlay.classList.add('active');
  },

  /** Updates HUD numbers. Called every frame. */
  tick(game) {
    if (!game.player) return;
    const p = game.player;
    // HP
    const hpPct = Utils.clamp(p.hp / p.maxHp, 0, 1);
    this.hpFill.style.width = (hpPct * 100) + '%';
    this.hpLabel.textContent = `HP: ${Math.ceil(p.hp)}/${Math.ceil(p.maxHp)}`;
    // XP
    const xpPct = Utils.clamp(p.xp / p.xpNext, 0, 1);
    this.xpFill.style.width = (xpPct * 100) + '%';
    this.xpLabel.textContent = `Lv ${p.level}  XP: ${Math.floor(p.xp)}/${Math.floor(p.xpNext)}`;
    // Cooldowns (fill grows from 0 -> 100% as cooldown REFILLS = ready)
    const swordTotal = CONFIG.SWORD.COOLDOWN * p.swordCdMul;
    const missTotal  = CONFIG.MISSILE.COOLDOWN * p.missileCdMul;
    const swordReady = 1 - (p.swordCd / Math.max(0.0001, swordTotal));
    const missReady  = 1 - (p.missileCd / Math.max(0.0001, missTotal));
    this.cdSwordFill.style.height   = (Utils.clamp(swordReady, 0, 1) * 100) + '%';
    this.cdMissileFill.style.height = (Utils.clamp(missReady,  0, 1) * 100) + '%';
    // Kills + timer + wave
    this.killCount.textContent = `Убийств: ${game.kills}`;
    this.runTimer.textContent  = Utils.formatTime(game.runTime);
    if (game.state === 'playing' || game.state === 'paused' || game.state === 'levelup') {
      const next = Math.max(0, Math.ceil(game.waveTimer));
      this.waveInfo.textContent = `Волна ${game.waveIndex + 1} через ${next}с`;
    }
  },
};


/* ============================================================
   BOOT
   ============================================================ */
window.addEventListener('load', () => {
  UI.init();
  Game.init();
});
</script>
</body>
